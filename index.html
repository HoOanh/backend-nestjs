<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arc Irobot Academy - Lộ Trình Master Cho Kỹ Sư React/Next.js</title>
    <meta name="description" content="Nền tảng đào tạo Master Backend NestJS 11 + Prisma 7 dành riêng cho kỹ sư Arc Irobot" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Google Identity Services (GIS) Official SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Theme init: chạy synchronous trước khi render để tránh flash dark→light -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('arc_backend_academy_theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
